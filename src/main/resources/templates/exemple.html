<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::section})}">

<head>
    <title>Modèle de page | ChatBot</title>
</head>

<body>

<section class="example-section">

    <div class="container py-5">

        <div class="page-heading mb-5">

            <span class="section-label">CHATBOT</span>

            <h1 class="section-title">
                Titre de votre nouvelle page
            </h1>

            <p class="section-description">
                Utilisez cette structure pour commencer la création
                de vos prochaines pages.
            </p>

        </div>

        <div class="feature-card">

            <div class="feature-icon">✦</div>

            <h3>Votre contenu ici</h3>

            <p>
                Remplacez ce texte par le contenu de votre nouvelle page.
                Le header, le footer et le style seront automatiquement intégrés.
            </p>

        </div>

    </div>

</section>

</body>
</html>
