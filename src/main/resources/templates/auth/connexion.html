<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::title}, ~{::section})}">

<head>
    <title>Connexion | ChatBot</title>
</head>

<body>

<section class="login-section">

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-75">

            <div class="col-md-8 col-lg-5">

                <div class="login-card">

                    <div class="text-center mb-4">

                        <div class="login-logo">
                            ✦
                        </div>

                        <h1 class="login-title">
                            Bon retour !
                        </h1>

                        <p class="login-description">
                            Connectez-vous pour accéder à votre espace ChatBot.
                        </p>

                    </div>

                    <form>

                        <div class="mb-4">

                            <label for="email" class="form-label">
                                Adresse e-mail
                            </label>

                            <input type="email"
                                   id="email"
                                   class="form-control chatbot-input"
                                   placeholder="exemple@email.com">

                        </div>

                        <div class="mb-4">

                            <label for="password" class="form-label">
                                Mot de passe
                            </label>

                            <input type="password"
                                   id="password"
                                   class="form-control chatbot-input"
                                   placeholder="Votre mot de passe">

                        </div>

                        <button type="button" class="btn btn-chatbot w-100 btn-lg">
                            Se connecter →
                        </button>

                    </form>

                    <div class="login-separator">
                        <span>CHATBOT</span>
                    </div>

                    <div class="text-center">
                        <a th:href="@{/}" class="back-home">
                            ← Retour à l'accueil
                        </a>
                    </div>

                </div>

                <p class="login-footer-text text-center mt-4">
                    Une expérience intelligente, simplement.
                </p>

            </div>

        </div>

    </div>

</section>

</body>
</html>
